name: Release

# Two products, two tag schemes:
# - Obsidian plugin: a bare version tag ("0.2.0"). Obsidian requires the
#   release tag to equal the version in manifest.json.
# - VS Code extension: "vscode-v<version>" ("vscode-v0.1.0").
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  obsidian:
    if: ${{ !startsWith(github.ref_name, 'vscode-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/obsidian
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build plugin
        run: |
          npm ci
          npm run build --workspace packages/obsidian
        working-directory: .

      - name: Check the tag matches manifest.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            packages/obsidian/main.js
            packages/obsidian/manifest.json
            packages/obsidian/styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Obsidian plugin $GITHUB_REF_NAME" \
            --draft \
            main.js manifest.json styles.css

  vscode:
    if: ${{ startsWith(github.ref_name, 'vscode-v') }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./packages/vscode/package.json').version")"
          if [ "vscode-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version ${version}" >&2
            exit 1
          fi

      - name: Build and package extension
        run: |
          npm ci
          npm run package --workspace packages/vscode

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/vscode/*.vsix

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "VS Code extension $GITHUB_REF_NAME" \
            --draft \
            packages/vscode/*.vsix

      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --no-dependencies --packagePath packages/vscode/*.vsix
